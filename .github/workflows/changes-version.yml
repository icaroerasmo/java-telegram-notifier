name: Changes version on release branches

on:
  create:
    branches:
      - 'release/*'

jobs:
  change-version:
    # Só roda para branches reais `release/*` — ignora branches de feature e tags `release/*`.
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract tag name
        id: extractTag
        run: echo "TAG_NAME=$(basename $GITHUB_REF_NAME)" >> $GITHUB_OUTPUT
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Change version
        run: mvn versions:set -DnewVersion=${{ steps.extractTag.outputs.TAG_NAME }} -DprocessAllModules
      - name: Commit version change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'pom.xml'
          commit_message: 'CI: Version bump to ${{ steps.extractTag.outputs.TAG_NAME }}'
